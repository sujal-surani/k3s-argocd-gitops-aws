apiVersion : argoproj.io/v1alpha1
kind: Application

metadata:
  name: aws-k3s-gitops-app
  namespace: argocd

spec :
  project : default
  source :
    repoURL : https://github.com/sujal-surani/k3s-argocd-gitops-aws
    targetRevision : main
    path : k8s
  
  destination :
    server : https://kubernetes.default.svc
    namespace : default
  
  syncPolicy :
    automated :
      prune : true 
      selfHeal : true
    
    syncOptions :
      - CreateNamespace=true